<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DJUPLOADER</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#161616;--surface2:#1e1e1e;
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.18);
  --red:#ff3b3b;--red-dim:rgba(255,59,59,0.1);
  --text:#f0ede8;--t2:rgba(240,237,232,0.55);--t3:rgba(240,237,232,0.28);
  --green:#3ddc84;--green-dim:rgba(61,220,132,0.1);
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--serif:'Instrument Serif',serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 20px 80px;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,59,59,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,59,59,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{width:100%;max-width:580px;position:relative;z-index:1;}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.logo-icon{width:34px;height:34px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:17px;height:17px;fill:white;}
.logo-text{font-family:var(--mono);font-size:12px;color:var(--t2);letter-spacing:.06em;text-transform:uppercase;}
h1{font-family:var(--serif);font-size:36px;font-weight:400;line-height:1.15;margin-bottom:8px;}
h1 em{font-style:italic;color:var(--red);}
.subtitle{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:40px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:12px;}
.card:hover{border-color:var(--border-h);}
.card-title{font-size:13px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.num{width:20px;height:20px;background:var(--red-dim);border:1px solid rgba(255,59,59,0.25);border-radius:50%;font-family:var(--mono);font-size:10px;color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
input[type=text],input[type=password]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:13px;color:var(--text);outline:none;transition:border-color .2s;}
input:focus{border-color:rgba(255,59,59,0.5);}
input::placeholder{color:var(--t3);}
.hint{margin-top:7px;font-size:12px;color:var(--t3);}
.hint a{color:rgba(255,59,59,0.7);text-decoration:none;}
.hint a:hover{color:var(--red);}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:10px 18px;font-family:var(--mono);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:opacity .2s,transform .1s;}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-red{background:var(--red);color:white;}
.btn-red:hover:not(:disabled){opacity:.88;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--t2);}
.btn-outline:hover:not(:disabled){border-color:var(--border-h);color:var(--text);}
.btn-full{width:100%;justify-content:center;}
.hidden{display:none;}

/* 채널 바 */
.channel-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.ch-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:5px 12px 5px 6px;font-size:13px;color:var(--t2);cursor:pointer;transition:border-color .2s,color .2s;}
.ch-chip:hover{border-color:var(--border-h);color:var(--text);}
.ch-chip.active{border-color:var(--red);color:var(--red);background:var(--red-dim);font-weight:500;}
.ch-chip img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--surface);flex-shrink:0;}
.ch-del{margin-left:4px;font-size:11px;opacity:.5;cursor:pointer;padding:0 2px;}
.ch-del:hover{opacity:1;color:var(--red);}
.ch-add{background:transparent;border:1px dashed var(--border);border-radius:99px;padding:5px 14px;font-size:12px;color:var(--t3);cursor:pointer;font-family:var(--mono);transition:border-color .2s,color .2s;}
.ch-add:hover{border-color:var(--border-h);color:var(--t2);}

/* 유저 바 */
.user-bar{background:var(--green-dim);border:1px solid rgba(61,220,132,0.2);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--surface2);}
.user-name{font-size:14px;font-weight:500;}
.user-email{font-size:12px;color:var(--t2);}
.signout{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--t3);cursor:pointer;text-decoration:underline;}
.signout:hover{color:var(--red);}

/* 영상 */
.video-grid{display:grid;gap:8px;}
.video-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s;}
.video-card:hover{border-color:var(--border-h);}
.video-card.selected{border-color:var(--red);background:var(--red-dim);}
.video-thumb{width:72px;height:40px;object-fit:cover;border-radius:5px;background:var(--surface2);flex-shrink:0;}
.video-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.video-meta{font-family:var(--mono);font-size:11px;color:var(--t3);}
.vcheck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.video-card.selected .vcheck{background:var(--red);border-color:var(--red);}
.vcheck-inner{display:none;width:10px;height:10px;}
.video-card.selected .vcheck-inner{display:block;}

/* 파일 */
.file-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-family:var(--mono);font-size:12px;color:var(--t2);cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap;}
.file-btn:hover{border-color:var(--border-h);color:var(--text);}
.file-name{font-family:var(--mono);font-size:12px;color:var(--t3);}
.file-name.ok{color:var(--green);}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.badge{background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:2px 9px;font-family:var(--mono);font-size:11px;color:var(--t2);}

/* 언어 버튼 */
.lang-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:13px;color:var(--t2);cursor:pointer;transition:border-color .2s,color .2s;}
.lang-btn:hover{border-color:var(--border-h);color:var(--text);}
.lang-btn.active{border-color:var(--red);color:var(--red);background:var(--red-dim);}

/* 진행 */
.prog-track{background:var(--surface2);border-radius:99px;height:4px;overflow:hidden;margin-bottom:14px;}
.prog-fill{height:100%;width:0%;background:var(--red);border-radius:99px;transition:width .4s;}
.log-box{max-height:160px;overflow-y:auto;font-family:var(--mono);font-size:11px;line-height:1.8;scrollbar-width:thin;}
.log-ok{color:var(--green);}
.log-err{color:var(--red);}
.log-info{color:var(--t3);}
.result{border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13px;margin-top:12px;}
.result.ok{background:var(--green-dim);border:1px solid rgba(61,220,132,0.2);color:var(--green);}
.result.err{background:var(--red-dim);border:1px solid rgba(255,59,59,0.2);color:var(--red);}
.divider{height:1px;background:var(--border);margin:16px 0;}
.sec-label{font-family:var(--mono);font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.15);border-top-color:var(--t2);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <div style="margin-bottom:40px;">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
      </div>
      <span class="logo-text">DJUPLOADER</span>
    </div>
    <h1>다국어 번역을<br/><em>자동 업로드</em></h1>
    <p class="subtitle">구글 로그인 → 채널 선택 → 영상 선택 → JSON 업로드</p>
  </div>

  <!-- STEP 1: Client ID -->
  <div class="card" id="loginBox">
    <div class="card-title"><div class="num">1</div>Google OAuth Client ID</div>
    <input type="text" id="clientId" placeholder="123456789-xxx.apps.googleusercontent.com" />
    <p class="hint"><a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud Console</a> → OAuth 2.0 클라이언트 ID</p>
    <div style="margin-top:12px;">
      <button class="btn btn-red" onclick="doLogin()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
        구글 로그인
      </button>
    </div>
  </div>

  <!-- 로그인 후 영역 -->
  <div id="mainSection" class="hidden">

    <!-- 유저 바 -->
    <div class="user-bar">
      <img id="userAvatar" class="user-avatar" src="" alt="" />
      <div>
        <div id="userName" class="user-name"></div>
        <div id="userEmail" class="user-email"></div>
      </div>
      <span class="signout" onclick="doSignout()">로그아웃</span>
    </div>

    <!-- 채널 바 -->
    <div class="channel-bar" id="channelBar"></div>

    <div class="divider"></div>

    <!-- STEP 2: 영상 선택 -->
    <div class="sec-label">② 영상 선택 — <span id="activeChName" style="color:var(--red);"></span></div>
    <div class="video-grid" id="videoList">
      <div style="font-family:var(--mono);font-size:12px;color:var(--t3);padding:12px 0;"><span class="spinner"></span>불러오는 중...</div>
    </div>
    <div id="loadMoreWrap" style="display:none;margin-top:8px;">
      <button class="btn btn-outline" onclick="loadMore()" id="loadMoreBtn">더 불러오기</button>
    </div>

    <div class="divider"></div>

    <!-- STEP 3: JSON 파일 -->
    <div class="sec-label">③ 번역 JSON 파일</div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="file" id="jsonFile" accept=".json" style="display:none;" />
        <div class="file-btn" onclick="document.getElementById('jsonFile').click()">파일 선택</div>
        <span class="file-name" id="fileName">선택된 파일 없음</span>
      </div>
      <div id="langPreview" class="hidden" style="margin-top:10px;">
        <div class="badges" id="langBadges"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- STEP 4: 기본 언어 -->
    <div class="sec-label">④ 기본 언어</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="lang-btn active" onclick="setLang(this,'ko')">🇰🇷 한국어</button>
      <button class="lang-btn" onclick="setLang(this,'en')">🇺🇸 English</button>
      <button class="lang-btn" onclick="setLang(this,'ja')">🇯🇵 日本語</button>
    </div>

    <!-- STEP 5: 업로드 -->
    <button class="btn btn-red btn-full" id="uploadBtn" onclick="doUpload()">업로드 시작 →</button>

    <!-- 진행 -->
    <div id="progressBox" class="card hidden" style="margin-top:12px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <span style="font-family:var(--mono);font-size:11px;color:var(--t2);text-transform:uppercase;">진행</span>
        <span id="progCount" style="font-family:var(--mono);font-size:11px;color:var(--t3);"></span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="log-box" id="logBox"></div>
    </div>
    <div id="resultBox"></div>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
let token = null;
let channels = [];
let activeCh = 0;
let nextPage = null;
let selectedVid = null;
let translations = null;
let defaultLang = 'ko';

// 저장된 Client ID 불러오기
window.addEventListener('load', () => {
  const saved = localStorage.getItem('dj_client_id');
  if (saved) document.getElementById('clientId').value = saved;

  document.getElementById('jsonFile').addEventListener('change', onJsonFile);
});

function makeTokenClient(clientId, hint, cb) {
  return google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/youtube.force-ssl https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
    login_hint: hint || '',
    prompt: hint ? '' : 'select_account',
    callback: cb
  });
}

async function doLogin() {
  const clientId = document.getElementById('clientId').value.trim();
  if (!clientId) { alert('Client ID를 입력해주세요.'); return; }
  localStorage.setItem('dj_client_id', clientId);

  makeTokenClient(clientId, '', async (resp) => {
    if (resp.error) { alert('로그인 실패: ' + resp.error); return; }
    token = resp.access_token;

    const [user, ch] = await Promise.all([fetchUser(token), fetchChannel(token)]);
    channels = [{ token, ...user, ...ch }];
    activeCh = 0;

    document.getElementById('userAvatar').src = user.picture || '';
    document.getElementById('userName').textContent = user.name || '';
    document.getElementById('userEmail').textContent = user.email || '';

    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('mainSection').classList.remove('hidden');

    renderChannelBar();
    await loadVideos();
  }).requestAccessToken();
}

async function addChannel() {
  const clientId = localStorage.getItem('dj_client_id');
  if (!clientId) { alert('Client ID가 없어요.'); return; }

  makeTokenClient(clientId, '', async (resp) => {
    if (resp.error) { alert('로그인 실패: ' + resp.error); return; }
    const t = resp.access_token;
    const [user, ch] = await Promise.all([fetchUser(t), fetchChannel(t)]);

    if (channels.find(c => c.channelId === ch.channelId)) {
      alert('이미 추가된 채널이에요!'); return;
    }
    channels.push({ token: t, ...user, ...ch });
    renderChannelBar();
    await switchChannel(channels.length - 1);
  }).requestAccessToken();
}

async function switchChannel(idx) {
  activeCh = idx;
  token = channels[idx].token;
  nextPage = null;
  selectedVid = null;
  renderChannelBar();
  document.getElementById('activeChName').textContent = channels[idx].channelName || channels[idx].name || '';
  document.getElementById('videoList').innerHTML = '<div style="font-family:\'DM Mono\',monospace;font-size:12px;color:rgba(240,237,232,0.28);padding:12px 0;"><span class="spinner"></span>불러오는 중...</div>';
  document.getElementById('loadMoreWrap').style.display = 'none';
  await loadVideos();
}

function removeChannel(idx) {
  if (channels.length === 1) { alert('마지막 채널은 삭제할 수 없어요.'); return; }
  channels.splice(idx, 1);
  if (activeCh >= channels.length) activeCh = channels.length - 1;
  renderChannelBar();
  switchChannel(activeCh);
}

function renderChannelBar() {
  const bar = document.getElementById('channelBar');
  bar.innerHTML = '';
  channels.forEach((ch, i) => {
    const chip = document.createElement('div');
    chip.className = 'ch-chip' + (i === activeCh ? ' active' : '');
    chip.innerHTML = `<img src="${ch.channelThumb||ch.picture||''}" alt="" onerror="this.style.display='none'" />${escHtml(ch.channelName||ch.name||'')}` +
      (channels.length > 1 ? `<span class="ch-del" onclick="event.stopPropagation();removeChannel(${i})">✕</span>` : '');
    chip.onclick = () => switchChannel(i);
    bar.appendChild(chip);
  });
  const add = document.createElement('div');
  add.className = 'ch-add';
  add.textContent = '+ 채널 추가';
  add.onclick = addChannel;
  bar.appendChild(add);

  // 현재 채널명 표시
  document.getElementById('activeChName').textContent = channels[activeCh]?.channelName || channels[activeCh]?.name || '';
}

async function loadVideos() {
  const url = 'https://www.googleapis.com/youtube/v3/videos?part=snippet&mine=true&maxResults=12'
    + (nextPage ? '&pageToken=' + nextPage : '');
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  const data = await res.json();

  nextPage = data.nextPageToken || null;
  document.getElementById('loadMoreWrap').style.display = nextPage ? 'block' : 'none';

  const list = document.getElementById('videoList');
  list.innerHTML = '';

  if (!data.items || data.items.length === 0) {
    list.innerHTML = '<div style="font-family:\'DM Mono\',monospace;font-size:12px;color:rgba(240,237,232,0.28);padding:12px 0;">업로드된 영상이 없어요.</div>';
    return;
  }

  data.items.forEach(item => {
    const vid = item.id;
    const title = item.snippet.title;
    const thumb = item.snippet.thumbnails?.medium?.url || '';
    const date = item.snippet.publishedAt?.slice(0,10) || '';
    const card = document.createElement('div');
    card.className = 'video-card';
    card.dataset.vid = vid;
    card.innerHTML = `
      <img class="video-thumb" src="${thumb}" alt="" />
      <div style="flex:1;overflow:hidden;">
        <div class="video-title">${escHtml(title)}</div>
        <div class="video-meta">${vid} · ${date}</div>
      </div>
      <div class="vcheck">
        <svg class="vcheck-inner" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;
    card.onclick = () => {
      document.querySelectorAll('.video-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedVid = vid;
    };
    list.appendChild(card);
  });
}

async function loadMore() {
  document.getElementById('loadMoreBtn').innerHTML = '<span class="spinner"></span>불러오는 중...';
  const url = 'https://www.googleapis.com/youtube/v3/videos?part=snippet&mine=true&maxResults=12'
    + (nextPage ? '&pageToken=' + nextPage : '');
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  const data = await res.json();
  nextPage = data.nextPageToken || null;
  document.getElementById('loadMoreWrap').style.display = nextPage ? 'block' : 'none';
  document.getElementById('loadMoreBtn').textContent = '더 불러오기';
  const list = document.getElementById('videoList');
  (data.items || []).forEach(item => {
    const vid = item.id;
    const title = item.snippet.title;
    const thumb = item.snippet.thumbnails?.medium?.url || '';
    const date = item.snippet.publishedAt?.slice(0,10) || '';
    const card = document.createElement('div');
    card.className = 'video-card';
    card.dataset.vid = vid;
    card.innerHTML = `
      <img class="video-thumb" src="${thumb}" alt="" />
      <div style="flex:1;overflow:hidden;">
        <div class="video-title">${escHtml(title)}</div>
        <div class="video-meta">${vid} · ${date}</div>
      </div>
      <div class="vcheck">
        <svg class="vcheck-inner" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;
    card.onclick = () => {
      document.querySelectorAll('.video-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedVid = vid;
    };
    list.appendChild(card);
  });
}

function onJsonFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const nameEl = document.getElementById('fileName');
  nameEl.textContent = file.name;
  nameEl.classList.add('ok');
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const langs = Object.keys(data.translations || {});
      translations = data;
      const preview = document.getElementById('langPreview');
      const badges = document.getElementById('langBadges');
      preview.classList.remove('hidden');
      badges.innerHTML = '';
      langs.slice(0,24).forEach(l => {
        const b = document.createElement('span');
        b.className = 'badge'; b.textContent = l;
        badges.appendChild(b);
      });
      if (langs.length > 24) {
        const m = document.createElement('span');
        m.style.cssText = 'font-family:var(--mono);font-size:11px;color:var(--t3);padding:2px 4px;';
        m.textContent = '+' + (langs.length-24) + '개';
        badges.appendChild(m);
      }
    } catch(err) { alert('JSON 파싱 실패: ' + err.message); }
  };
  reader.readAsText(file);
}

function setLang(btn, lang) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  defaultLang = lang;
}

async function doUpload() {
  if (!selectedVid) return showResult('err', '영상을 선택해주세요.');
  if (!translations) return showResult('err', 'JSON 파일을 먼저 불러와주세요.');

  const langs = Object.keys(translations.translations || {});
  if (!langs.length) return showResult('err', '번역 데이터가 없어요.');

  document.getElementById('progressBox').classList.remove('hidden');
  document.getElementById('resultBox').innerHTML = '';
  document.getElementById('logBox').innerHTML = '';
  document.getElementById('uploadBtn').disabled = true;
  document.getElementById('progFill').style.width = '20%';

  addLog('▶ 영상 정보 불러오는 중...', 'info');

  // 기존 snippet 가져오기
  let snippet = null;
  try {
    const r = await fetch('https://www.googleapis.com/youtube/v3/videos?part=snippet&id=' + selectedVid,
      { headers: { Authorization: 'Bearer ' + token } });
    const d = await r.json();
    snippet = d.items?.[0]?.snippet || null;
  } catch(e) {}

  if (!snippet) {
    showResult('err', '영상 정보를 불러올 수 없어요.');
    document.getElementById('uploadBtn').disabled = false;
    return;
  }

  document.getElementById('progFill').style.width = '50%';
  addLog('▶ 번역 업로드 중... (' + langs.length + '개 언어)', 'info');

  const localizations = {};
  langs.forEach(lang => {
    const t = translations.translations[lang];
    localizations[lang] = {
      title: t.title || snippet.title,
      description: t.description || ''
    };
  });

  const body = {
    id: selectedVid,
    localizations,
    snippet: {
      title: snippet.title,
      description: snippet.description,
      categoryId: snippet.categoryId,
      defaultLanguage: defaultLang
    }
  };

  try {
    const res = await fetch('https://www.googleapis.com/youtube/v3/videos?part=localizations,snippet', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(body)
    });
    document.getElementById('progFill').style.width = '100%';
    if (res.ok) {
      langs.forEach(l => addLog('✓ ' + l, 'ok'));
      showResult('ok', '✓ ' + langs.length + '개 언어 모두 업로드 완료!');
    } else {
      const err = await res.json().catch(() => ({}));
      addLog('✗ 실패: ' + (err.error?.message || res.status), 'err');
      showResult('err', '업로드 실패. 로그를 확인해주세요.');
    }
  } catch(e) {
    addLog('✗ 네트워크 오류: ' + e.message, 'err');
    showResult('err', '네트워크 오류가 발생했어요.');
  }

  document.getElementById('uploadBtn').disabled = false;
}

function doSignout() {
  token = null; channels = []; activeCh = 0; selectedVid = null; translations = null; nextPage = null;
  document.getElementById('mainSection').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
  document.getElementById('channelBar').innerHTML = '';
  document.getElementById('resultBox').innerHTML = '';
  document.getElementById('progressBox').classList.add('hidden');
}

async function fetchUser(t) {
  const r = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', { headers: { Authorization: 'Bearer ' + t } });
  return r.json();
}

async function fetchChannel(t) {
  const r = await fetch('https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true', { headers: { Authorization: 'Bearer ' + t } });
  const d = await r.json();
  const ch = d.items?.[0];
  return {
    channelId: ch?.id || '',
    channelName: ch?.snippet?.title || '',
    channelThumb: ch?.snippet?.thumbnails?.default?.url || ''
  };
}

function addLog(msg, type) {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : 'log-info';
  line.textContent = msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function showResult(type, msg) {
  const el = document.getElementById('resultBox');
  el.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'result ' + type;
  d.textContent = msg;
  el.appendChild(d);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
